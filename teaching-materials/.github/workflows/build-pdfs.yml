name: Build and publish teaching resources

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"

      - name: Build all teaching resources
        run: bash render.sh all

      - name: Stage website
        run: |
          rm -rf site-build
          mkdir -p site-build
          cp site/index.html site-build/index.html
          cp dist/*.pdf dist/*.docx site-build/

      - name: Upload generated documents
        uses: actions/upload-artifact@v4
        with:
          name: teaching-resources
          path: dist/
          if-no-files-found: error

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-build/

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
