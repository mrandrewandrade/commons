project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"
    - "!mindfulness/"
    - "!posts/"
    - "!research/"
  pre-render:
  - python ../scripts/bs_pre_render.py
  resources:
    - "assets/icons/**"
    - "assets/branding/**"
    - assets/nice-design-tool.js
    - assets/bs-learn.js
    - assets/bs-research-index.js
    - assets/bs-glossary.js
    - assets/commons-lore.js
    - assets/teacher-slides.js
    - assets/teacher-slides.css
    - assets/bs-glossary-lookup.json
    - "assets/lore/**"

filters:
  - bs-link-policy

website:
  title: "Technological Education Resources"
  site-url: "https://andrewandrade.ca/tech-edu-resources/"
  repo-url: "https://github.com/mrandrewandrade/tech-edu-resources"
  description: "Open Ontario Technological Education classroom resources, slides, assignments, collaborative notes, and reusable teaching materials."
  open-graph: true
  twitter-card: true
  search:
    location: navbar
    type: overlay
  navbar:
    logo: assets/branding/emblem/commons-emblem-monochrome-blue.svg
    logo-alt: "Technological Education Resources"
    title: "Tech Edu"
    collapse-below: xl
    left:
      - href: slides/tas.qmd
        text: TAS Slides
      - href: slides/tej.qmd
        text: TEJ Slides
      - href: tas2/index.qmd
        text: TAS Notes
      - href: tej3-4/index.qmd
        text: TEJ Notes
    right:
      - href: teacher-slides/index.qmd
        text: General Slides
      - href: teaching-materials/index.qmd
        text: General Materials
      - href: glossary/index.qmd
        text: Glossary
      - href: lore/index.qmd
        text: Lore
      - href: https://andrewandrade.ca/tech-edu-resources/about.html
        text: About
  sidebar:
    - id: tas2
      title: "TAS Notes"
      style: docked
      collapse-level: 1
      contents:
        - text: "Course Home"
          href: tas2/index.qmd
        - text: "0. Getting to Know You"
          href: tas2/00-getting-to-know-you.qmd
        - text: "1. N.I.C.E. Design Process"
          href: tas2/01-nice-design-process.qmd
    - id: tej
      title: "TEJ Notes"
      style: docked
      collapse-level: 1
      contents:
        - text: "Course Home"
          href: tej3-4/index.qmd
        - text: "0. Getting to Know You"
          href: tej3-4/00-getting-to-know-you.qmd
        - text: "1. Measurement & Basic Circuits"
          href: tej3-4/01-measurement-basic-circuits.qmd
  page-footer:
    left: |
      **CC BY-SA 4.0 · Share, modify, and redistribute.** Modified versions remain CC BY-SA 4.0 and attribute the original source: [andrewandrade.ca](https://andrewandrade.ca/) · [github.com/mrandrewandrade](https://github.com/mrandrewandrade). Add your own name and links when you adapt it so future versions can credit you too. **Sharing is caring.**
    center: |
      Website code: [AGPL 3.0](https://andrewandrade.ca/tech-edu-resources/licensing.html). Educational content: [CC BY-SA 4.0](https://andrewandrade.ca/tech-edu-resources/licensing.html).
    right:
      - text: Licensing
        href: licensing.qmd
      - text: About
        href: about.qmd

format:
  html:
    theme: [cosmo, assets/bs-theme.scss]
    css:
      - assets/bs-shared.css
      - assets/bs-components.css
      - assets/commons-overrides.css
      - assets/bs-learn.css
    include-after-body:
      - includes/bs-scripts.html
    include-in-header:
      - includes/site-head.html
    toc: true
    toc-location: right
    toc-depth: 3
    toc-title: "On this page"
    smooth-scroll: true
    link-external-newwindow: false
    code-copy: true

execute:
  freeze: auto

editor: source
