project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"
    - "!mindfulness/"
    - "!posts/"
    - "!research/"
  pre-render:
  - python ../scripts/bs_pre_render.py
  resources:
    - "assets/icons/**"
    - "assets/branding/**"
    - assets/nice-design-tool.js
    - assets/bs-learn.js
    - assets/bs-research-index.js
    - assets/bs-glossary.js
    - assets/commons-lore.js
    - assets/teacher-slides.js
    - assets/teacher-slides.css
    - assets/bs-glossary-lookup.json
    - "assets/lore/**"

filters:
  - bs-link-policy

website:
  title: "Technological Education Resources"
  description: "Open classroom materials, slides, assignments, and educator resources supporting the Ontario Technological Education curriculum."
  search:
    location: navbar
    type: overlay
  navbar:
    logo: assets/branding/emblem/commons-emblem-monochrome-blue.svg
    logo-alt: "Technological Education Resources"
    title: "Tech Edu"
    collapse-below: xl
    left:
      - href: slides/tas.qmd
        text: TAS Slides
      - href: slides/tej.qmd
        text: TEJ Slides
      - href: tas2/index.qmd
        text: TAS Notes
      - href: tej3-4/index.qmd
        text: TEJ Notes
    right:
      - href: teacher-slides/index.qmd
        text: General Slides
      - href: teaching-materials/index.qmd
        text: General Materials
      - href: lore/index.qmd
        text: Lore
      - href: about.qmd
        text: About
  sidebar:
    - id: tas2
      title: "TAS Notes"
      style: docked
      collapse-level: 1
      contents:
        - text: "Course Home"
          href: tas2/index.qmd
        - text: "0. Getting to Know You"
          href: tas2/00-getting-to-know-you.qmd
        - text: "1. N.I.C.E. Design Process"
          href: tas2/01-nice-design-process.qmd
        - text: "2. Building Computers"
          href: tas2/02-building-computers.qmd
        - text: "3. Logo Design & Animation"
          href: tas2/03-logo-design-animation.qmd
        - text: "4. Website Design"
          href: tas2/04-website-design.qmd
    - id: tej
      title: "TEJ Notes"
      style: docked
      collapse-level: 1
      contents:
        - text: "Course Home"
          href: tej3-4/index.qmd
        - text: "0. Getting to Know You"
          href: tej3-4/00-getting-to-know-you.qmd
        - text: "1. Number Systems & Basic Circuits"
          href: tej3-4/01-number-systems-basic-circuits.qmd
        - text: "2. Building Computers"
          href: tej3-4/02-building-computers.qmd
        - text: "3. Logo Design & Animation"
          href: tej3-4/03-logo-design-animation.qmd
        - text: "4. Website Design"
          href: tej3-4/04-website-design.qmd
  page-footer:
    left: |
      Open educational resources by [Andrew Andrade](https://www.linkedin.com/in/andrewandrade) and contributors. Hosted on [GitHub Pages](https://github.com/mrandrewandrade/tech-edu-resources).
    center: |
      Text: [CC BY-SA 4.0](/licensing.html), attribution and share-alike required. Code: [AGPL 3.0](/licensing.html), copyleft applies.
    right:
      - text: About
        href: /about.html

format:
  html:
    theme: [cosmo, assets/bs-theme.scss]
    css:
      - assets/bs-shared.css
      - assets/bs-components.css
      - assets/commons-overrides.css
      - assets/bs-learn.css
    include-after-body:
      - includes/bs-scripts.html
    include-in-header:
      - includes/site-head.html
    toc: true
    toc-location: right
    toc-depth: 3
    toc-title: "On this page"
    smooth-scroll: true
    link-external-newwindow: false
    code-copy: true

execute:
  freeze: auto

editor: source
