project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"
    - "!mindfulness/"
    - "!posts/"
    - "!research/"
    - "!ttj3-4/"
    - "!slides/tts.qmd"
  pre-render:
  - python ../scripts/bs_pre_render.py
  resources:
    - "assets/icons/**"
    - "assets/branding/**"
    - assets/nice-design-tool.js
    - assets/bs-learn.js
    - assets/bs-research-index.js
    - assets/bs-glossary.js
    - assets/commons-lore.js
    - assets/teacher-slides.js
    - assets/teacher-slides.css
    - assets/bs-glossary-lookup.json
    - "assets/lore/**"

filters:
  - bs-link-policy

website:
  title: "Technological Education Resources"
  description: "Open classroom materials, slides, assignments, and educator resources supporting the Ontario Technological Education curriculum."
  search:
    location: navbar
    type: overlay
  navbar:
    logo: assets/branding/emblem/commons-emblem-monochrome-blue.svg
    logo-alt: "Technological Education Resources"
    title: "Tech Edu"
    collapse-below: xl
    left:
      - href: tas2/index.qmd
        text: TAS2
      - href: tej3-4/index.qmd
        text: TEJ3/4
      - text: Class Slides
        menu:
          - text: TAS
            href: slides/tas.qmd
          - text: TEJ
            href: slides/tej.qmd
    right:
      - href: teacher-slides/index.qmd
        text: General Slides
      - href: teaching-materials/index.qmd
        text: General Materials
      - href: lore/index.qmd
        text: Lore
      - href: about.qmd
        text: About
  sidebar:
    - id: tas2
      title: "TAS2O"
      style: docked
      collapse-level: 1
      contents:
        - text: "Course Home"
          href: tas2/index.qmd
        - section: "Getting Started"
          contents:
            - text: "1. Starting Point"
              href: tas2/01-starting-point.qmd
            - text: "2. Identity, Logo & Emblem"
              href: tas2/02-identity-logo-emblem.qmd
        - section: "Design & Make"
          contents:
            - text: "3. Digital Design & Photopea"
              href: tas2/03-digital-design-photopea.qmd
            - text: "4. Measurement & Onshape"
              href: tas2/04-measurement-onshape.qmd
            - text: "5. Fabrication & Materials"
              href: tas2/05-fabrication-materials.qmd
            - text: "6. Electronics & Tinkercad"
              href: tas2/06-electronics-tinkercad.qmd
        - section: "Bring It Together"
          contents:
            - text: "7. Integrated Project & Portfolio"
              href: tas2/07-integrated-project-portfolio.qmd
    - id: tej
      title: "TEJ3M / TEJ4M"
      style: docked
      collapse-level: 1
      contents:
        - text: "Course Home"
          href: tej3-4/index.qmd
        - section: "Environment"
          contents:
            - text: "1. Starting Point"
              href: tej3-4/01-starting-point.qmd
            - text: "2. Linux & Computer Systems"
              href: tej3-4/02-linux-computer-systems.qmd
            - text: "3. Git, GitHub & Portfolio"
              href: tej3-4/03-git-github-portfolio.qmd
        - section: "Programming & Logic"
          contents:
            - text: "4. Python Foundations"
              href: tej3-4/04-python-foundations.qmd
            - text: "5. Logic & Digital Systems"
              href: tej3-4/05-logic-digital-systems.qmd
            - text: "6. Python, Data & DataFrames"
              href: tej3-4/06-python-data-dataframes.qmd
        - section: "Machine Learning"
          contents:
            - text: "7. Machine Learning"
              href: tej3-4/07-machine-learning.qmd
            - text: "8. Major Project & Portfolio"
              href: tej3-4/08-major-project-portfolio.qmd
  page-footer:
    left: |
      Open educational resources by [Andrew Andrade](https://www.linkedin.com/in/andrewandrade) and contributors. Hosted on [GitHub Pages](https://github.com/mrandrewandrade/tech-edu-resources).
    center: |
      Text: [CC BY-SA 4.0](/licensing.html), attribution and share-alike required. Code: [AGPL 3.0](/licensing.html), copyleft applies.
    right:
      - text: About
        href: /about.html

format:
  html:
    theme: [cosmo, assets/bs-theme.scss]
    css:
      - assets/bs-shared.css
      - assets/bs-components.css
      - assets/commons-overrides.css
      - assets/bs-learn.css
    include-after-body:
      - includes/bs-scripts.html
    include-in-header:
      - includes/site-head.html
    toc: true
    toc-location: right
    toc-depth: 3
    toc-title: "On this page"
    smooth-scroll: true
    link-external-newwindow: false
    code-copy: true

execute:
  freeze: auto

editor: source
