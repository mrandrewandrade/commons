name: Build Commons brand assets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cairosvg pillow ezdxf svgpathtools
      - run: python favicons_logos_icons/generate_brand_assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: commons-brand-assets
          path: site/assets/branding
