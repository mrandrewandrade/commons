name: Check Commons site
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.15'
      - run: python -m pip install -r requirements.txt
      - run: quarto render site
      - run: python scripts/check_commons.py --rendered
      - uses: actions/upload-artifact@v4
        with:
          name: commons-site
          path: site/_site
