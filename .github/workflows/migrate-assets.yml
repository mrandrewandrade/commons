name: Migrate published teaching assets

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/migrate-assets.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download current published outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/assets/materials
          base="https://andrewandrade.ca/assets"
          files=(
            "0.0-name-tag-pdf.docx"
            "0.0-name-tag-pdf.pdf"
            "0.1-0.2-combined-teacher-marking.docx"
            "0.1-0.2-combined-teacher-marking.pdf"
            "0.1-past-present-becoming.docx"
            "0.1-past-present-becoming.pdf"
            "0.2-the-way-we-meet-notes-bw.pdf"
            "0.2-the-way-we-meet-notes.docx"
            "0.2-the-way-we-meet-notes.pdf"
            "0.2-the-way-we-meet.docx"
            "0.2-the-way-we-meet.pdf"
            "weekly-smart-goal-progress-log-bw.pdf"
            "weekly-smart-goal-progress-log.docx"
            "weekly-smart-goal-progress-log.pdf"
          )
          for file in "${files[@]}"; do
            echo "Downloading $file"
            curl --fail --location --retry 4 --retry-delay 2               "$base/$file"               --output "site/assets/materials/$file"
            test -s "site/assets/materials/$file"
          done

          for file in site/assets/materials/*.pdf; do
            head -c 4 "$file" | grep -q '%PDF'
          done
          for file in site/assets/materials/*.docx; do
            head -c 2 "$file" | grep -q 'PK'
          done

      - name: Point website at consolidated assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("site/teaching-materials/index.qmd")
          text = path.read_text(encoding="utf-8")
          text = text.replace("https://andrewandrade.ca/assets/", "../assets/materials/")
          path.write_text(text, encoding="utf-8")
          PY
          if grep -R "https://andrewandrade.ca/assets/" site --include='*.qmd' --include='*.yml' --include='*.yaml'; then
            echo "Old Assets-site dependency still exists."
            exit 1
          fi

      - name: Record migration and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/migrate-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/materials site/teaching-materials/index.qmd .github/workflows/migrate-assets.yml
          git commit -m "Consolidate published teaching assets"
          git push origin HEAD:master
